name: Bug report
description: Something in the dashboard, backend or engine doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, don't file an issue: report it privately at
        https://github.com/shidhartha-sen/opendots/security/advisories/new.
        Never paste API keys, engine tokens, phone numbers or message text here.
  - type: dropdown
    id: part
    attributes:
      label: Where is the problem?
      options:
        - Dashboard
        - Backend (Convex)
        - Engine (runner)
        - Self-hosting or setup
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Text the agent ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Engine version (shown in Connections, or `openbots-runner@x.y.z`) and/or the commit you deployed.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and Node.js version of the engine's computer, browser, texting service (Messages, BlueBubbles, Sendblue, Twilio, relay) and AI provider, as relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Engine or browser console output, with keys, tokens and numbers removed.
      render: shell
