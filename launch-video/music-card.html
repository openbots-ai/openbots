<!doctype html><meta charset="utf-8">
<style>
@font-face { font-family: 'Figtree Variable'; src: url('assets/fonts/figtree-latin-wght-normal.woff2') format('woff2'); font-weight: 300 900; }
html,body{margin:0;width:1920px;height:1080px;background:#fff;font-family:'Figtree Variable',sans-serif;font-weight:500;color:#0a0a0a;-webkit-font-smoothing:antialiased}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tag{background:#23204e;color:#fff;border-radius:999px;padding:14px 34px;font-size:34px;font-weight:600}
h1{font-size:200px;letter-spacing:-.04em;line-height:1;margin:44px 0 0;font-weight:500}
p{font-size:44px;color:#737373;font-weight:400;margin:28px 0 0}
.meta{margin-top:56px;display:flex;gap:18px}
.pill{background:#f5f5f5;box-shadow:0 0 0 1px rgb(0 0 0 / .08);border-radius:999px;padding:14px 32px;font-size:32px}
</style>
<div class="wrap"><div class="tag" id="tag"></div><h1 id="name"></h1><p id="desc"></p><div class="meta" id="meta"></div></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('tag').textContent='Option '+q.get('n');document.getElementById('name').textContent=q.get('name');document.getElementById('desc').textContent=q.get('desc');
document.getElementById('meta').innerHTML=q.get('meta').split('|').map(s=>`<span class="pill">${s}</span>`).join('');
</script>
