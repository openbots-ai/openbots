<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenBots launch</title>
<link rel="stylesheet" href="assets/devices.css">
<style>
@font-face { font-family: 'Figtree Variable'; src: url('assets/fonts/figtree-latin-wght-normal.woff2') format('woff2'); font-weight: 300 900; }

/* Tokens lifted from src/index.css and the logo */
:root {
  --fg: #0a0a0a;
  --muted: #737373;
  --primary: #23204e;
  --primary-light: #3b37a3;
  --lav: #7d79d8;
  --card: rgb(245 245 245 / 0.7);
  --ring: rgb(0 0 0 / 0.04);
  --imsg-blue: #0A84FF;
  --imsg-grey: #E9E9EB;
  --ok: #059669;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
body { font-family: 'Figtree Variable', sans-serif; font-weight: 500; color: var(--fg); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }

.scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
.scene.light { background: #fff; }
.cam { position: absolute; inset: 0; transform-origin: 50% 50%; }

/* Type scale (type-display / type-title) scaled up for video */
.display { font-size: 138px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 500; text-align: center; }
.title { font-size: 120px; line-height: 1.08; letter-spacing: -0.03em; font-weight: 500; text-align: center; }
.w { display: inline-block; will-change: transform, opacity, filter; }
.g-gray { color: #8c8c8c; }
.g-ink { color: var(--primary); }

/* Cards: the landing's bg-neutral-100/70 + ring card */
.card { background: var(--card); box-shadow: 0 0 0 1px var(--ring); border-radius: 28px; }
.chip-icon { width: 64px; height: 64px; border-radius: 18px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 0 0 1px rgb(0 0 0 / .05); display: grid; place-items: center; color: var(--primary); }
.chip-icon svg { width: 30px; height: 30px; }

/* Agent cursor chips (the landing's AgentCursors) */
.agent-chip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 12px; border-radius: 22px; font-size: 24px; line-height: 1.25; box-shadow: 0 8px 30px rgb(0 0 0 / .06); }
.agent-chip img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
.agent-chip b { font-weight: 500; display: block; }
.agent-chip span { display: block; font-weight: 400; opacity: .8; }
.agent-chip svg.cur { position: absolute; left: -18px; top: -22px; width: 26px; height: 26px; }
.chip-tofu { background: #fcf1e4; color: #6b3a06; } .chip-rishi { background: #f1e6fd; color: #4c1d95; } .chip-mochi { background: #efe6fb; color: #4c1d95; } .chip-pebble { background: #e3f6ee; color: #065f46; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 10px; height: 64px; padding: 0 34px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 26px; font-weight: 600; }
.btn.sm { height: 46px; font-size: 20px; padding: 0 22px; }
.pill { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 10px 22px; font-size: 22px; font-weight: 500; }

/* iMessage, from src/index.css */
.imsg { position: relative; }
.imsg-tail::before, .imsg-tail::after { content: ''; position: absolute; bottom: 0; height: 18px; }
.imsg-tail::before { width: 18px; background: inherit; }
.imsg-tail::after { width: 10px; background: #fff; }
.imsg-me.imsg-tail::before { right: -7px; border-bottom-left-radius: 16px 14px; }
.imsg-me.imsg-tail::after { right: -10px; border-bottom-left-radius: 10px; }
.imsg-them.imsg-tail::before { left: -7px; border-bottom-right-radius: 16px 14px; }
.imsg-them.imsg-tail::after { left: -10px; border-bottom-right-radius: 10px; }
.bub { display: block; padding: 6px 12px; border-radius: 18px; max-width: 78%; font-size: 13px; line-height: 1.35; font-weight: 400; }
.bub.me { background: var(--imsg-blue); color: #fff; }
.bub.them { background: var(--imsg-grey); color: #000; }
.row { display: flex; flex-direction: column; margin-bottom: 8px; }
.row.me { align-items: flex-end; } .row.them { align-items: flex-start; }
.on-card .imsg-tail::after { background: #fff; }

/* Phone: 336px base, same geometry as phone-demo.tsx */
.phone { position: absolute; width: 336px; height: 687px; transform-origin: 0 0; }
.phone .body-shadow { position: absolute; left: 1.85%; top: .8%; right: 1.8%; bottom: .8%; border-radius: 18.2% / 8.7%; box-shadow: 0 40px 80px -20px rgb(0 0 0 / .3), 0 15px 30px -15px rgb(0 0 0 / .2); }
.phone .screen { position: absolute; left: 5.333%; top: 2.5%; width: 89.333%; height: 95%; background: #fff; border-radius: 15.75% / 7.25%; clip-path: inset(0 round 15.75% / 7.25%); overflow: hidden; color: #000; font-size: 13px; }
.phone img.frame { position: absolute; inset: 0; width: 100%; height: 100%; }
.glass { background: rgb(255 255 255 / .9); box-shadow: 0 2px 12px rgb(0 0 0 / .08), 0 0 0 1px rgb(0 0 0 / .05); }

/* App window (dashboard) */
.win { position: absolute; background: #fff; border-radius: 22px; box-shadow: 0 30px 60px -30px rgb(0 0 0 / .18), 0 0 0 1px rgb(0 0 0 / .06); overflow: hidden; }
.win .bar { height: 54px; background: #f5f5f5; display: flex; align-items: center; gap: 10px; padding: 0 22px; border-bottom: 1px solid #e5e5e5; }
.dot { width: 14px; height: 14px; border-radius: 50%; }
.url { margin: 0 auto; background: #fff; border-radius: 8px; padding: 6px 60px; font-size: 18px; color: #525252; font-weight: 400; }



/* 4:5 portrait for X */
html.p45, html.p45 body, html.p45 #stage { width: 1080px; height: 1350px; }
.p45 .display { font-size: 122px; }
.p45 .title { font-size: 116px; }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
</div>
<script src="assets/gsap.min.js"></script>
<script src="main.js"></script>
</body>
</html>
